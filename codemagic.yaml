workflows:
  ios-simulator:
    name: NIFNAIL PRO CAMERA - Simulator + iPhone IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'camera-v2-development'
          include: true
    environment:
      vars:
        XCODE_PROJECT: "NIFNAIL_PRO_CAMERA.xcodeproj"
        XCODE_SCHEME: "NIFNAIL_PRO_CAMERA"
      xcode: latest
    scripts:
      - name: Show Xcode version
        script: xcodebuild -version
      - name: Build for iOS Simulator (unsigned)
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Archive for physical iPhone (unsigned)
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/NIFNAIL_PRO_CAMERA.xcarchive \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive
      - name: Package unsigned IPA for Sideloadly
        script: |
          APP_PATH="build/NIFNAIL_PRO_CAMERA.xcarchive/Products/Applications/NIFNAIL_PRO_CAMERA.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          ditto "$APP_PATH" build/ipa/Payload/NIFNAIL_PRO_CAMERA.app
          cd build/ipa
          /usr/bin/zip -qry ../NIFNAIL_PRO_CAMERA-unsigned.ipa Payload
          cd ../..
          test -s build/NIFNAIL_PRO_CAMERA-unsigned.ipa
    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app
      - build/Build/Products/Debug-iphonesimulator/*.dSYM
      - build/NIFNAIL_PRO_CAMERA-unsigned.ipa
      - build/NIFNAIL_PRO_CAMERA.xcarchive/dSYMs/*.dSYM
