workflows:
  ios-simulator:
    name: NIFNAIL PRO CAMERA - iOS Simulator
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'camera-v2-development'
          include: true
    environment:
      vars:
        XCODE_PROJECT: "NIFNAIL_PRO_CAMERA.xcodeproj"
        XCODE_SCHEME: "NIFNAIL_PRO_CAMERA"
      xcode: latest
    scripts:
      - name: Show Xcode version
        script: xcodebuild -version
      - name: Build for iOS Simulator (unsigned)
        script: |
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/Build/Products/Debug-iphonesimulator/*.app
      - build/Build/Products/Debug-iphonesimulator/*.dSYM
