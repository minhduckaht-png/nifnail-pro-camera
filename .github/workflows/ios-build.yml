name: iOS build check

on:
  push:
    branches:
      - main
      - camera-v2-development
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project NIFNAIL_PRO_CAMERA.xcodeproj \
            -scheme NIFNAIL_PRO_CAMERA \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
